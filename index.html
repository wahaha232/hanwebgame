<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DOS Classic Games - Play Classic DOS Games Online</title>
<meta name="description" content="Play classic DOS games directly in your web browser using a browser-based DOS emulator."/>
<meta property="og:title" content="DOS Classic Games"/>
<meta property="og:description" content="Play classic DOS games directly in your web browser."/>
<meta property="og:type" content="website"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="shell">
  <header id="titlebar">
    <div class="title"><h1 data-i18n="brand">DOS CLASSIC GAMES</h1></div>
    <p class="sub" data-i18n="subtitle">PLAY THE CLASSIC DOS GAMES IN YOUR BROWSER</p>
    <div id="langsel" role="group" aria-label="language">
      <span data-i18n="choose_lang">語言:</span>
      <button class="langbtn" data-lang="zh">繁體</button>
      <button class="langbtn" data-lang="en">EN</button>
      <button class="langbtn" data-lang="es">ES</button>
    </div>
  </header>

  <nav id="menubar" role="menubar" aria-label="menu">
    <span data-i18n="menu_file">檔案</span>
    <span data-i18n="menu_game">遊戲</span>
    <span data-i18n="menu_view">檢視</span>
    <span data-i18n="menu_sound">音效</span>
    <span data-i18n="menu_help">說明</span>
  </nav>

  <main id="content">
    <section id="emulator" aria-label="DOS emulator">
      <div id="screen" tabindex="0" role="img" aria-label="DOS emulator screen">
        <div class="prompt" data-i18n="prompt_line1">C:&gt; HAN.EXE</div>
        <div class="game" data-i18n="prompt_line2">楚漢相爭</div>
        <div id="emulatorNote" class="note hidden" data-i18n="emulator_soon"></div>
      </div>
      <div id="controls">
        <button id="btnPlay" data-i18n="btn_play">▶ PLAY</button>
        <button id="btnFull" data-i18n="btn_full">⛶ FULLSCREEN</button>
        <button id="btnSound" data-i18n="btn_sound">🔊 SOUND</button>
      </div>
    </section>

    <section id="games">
      <h2 data-i18n="avail_games">AVAILABLE GAMES</h2>
      <div id="gameList" class="gameList" aria-live="polite">
        <p data-i18n="loading">載入遊戲清單…</p>
      </div>
    </section>
  </main>

  <footer id="footerbar">
    <p data-i18n="footer1">DOS CLASSIC GAMES © 2026</p>
    <p class="meta" data-i18n="footer2">Built for classic PC gaming</p>
    <p class="meta legal" data-i18n="footer_legal"></p>
  </footer>
</div>

<div id="errorScreen" class="hidden" role="alert">
  <pre>DOS GAME ERROR
|
Unable to start game.
Possible causes:
Game files missing / Emulator failed
[ RETRY ]</pre>
  <button id="btnRetry">RETRY</button>
</div>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
